version: "3.9"

services:
  master:
    image: postgres:16
    container_name: pg-master
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - master-data:/var/lib/postgresql/data
      - ./master/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c listen_addresses='*'

  replica:
    image: postgres:16
    container_name: pg-replica
    restart: always
    depends_on:
      - master
    environment:
      PGPASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - replica-data:/var/lib/postgresql/data
    command: >
      bash -c "
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          rm -rf /var/lib/postgresql/data/*
          until pg_basebackup -h master -D /var/lib/postgresql/data -U replicator -Fp -Xs -P -R;
          do
            echo 'waiting for master...'
            sleep 2
          done
          chown -R postgres:postgres /var/lib/postgresql/data
          chmod 700 /var/lib/postgresql/data
        fi;
        su postgres -c 'postgres -D /var/lib/postgresql/data'
      "

volumes:
  master-data:
  replica-data:
